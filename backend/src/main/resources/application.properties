spring.application.name=backend

# Datos sensibles (contraseñas) en un archivo local que no se sube a Git
spring.config.import=optional:file:./secrets.properties

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/horneo
spring.datasource.username=horneo

# Las tablas las crea Flyway (src/main/resources/db/migration);
# Hibernate solo comprueba que las entidades coinciden con ellas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
